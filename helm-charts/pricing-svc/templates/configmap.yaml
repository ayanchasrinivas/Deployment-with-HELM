apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pricing-svc.fullname" . }}
  labels:
    {{- include "pricing-svc.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  BASE_MARKUP: {{ .Values.config.baseMarkup | quote }}
  STARTUP_DELAY_SECONDS: {{ .Values.config.startupDelaySeconds | quote }}
  APP_VERSION: {{ .Values.image.tag | default .Chart.AppVersion | quote }}